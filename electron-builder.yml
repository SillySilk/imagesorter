appId: com.panpdx.aperture
productName: Aperture
copyright: "Copyright © 2024 PanPDX"

directories:
  output: dist

files:
  - out/**
  - resources/**

extraFiles:
  - from: register-associations.bat
    to: register-associations.bat
  - from: register-associations.ps1
    to: register-associations.ps1

asarUnpack:
  - "node_modules/sharp/**"
  - "node_modules/@img/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # Local self-signed code signing (see .certs/, gitignored).
  # The PFX password is NOT a meaningful secret: a self-signed cert only
  # asserts "PanPDX" and is forgeable by anyone. For distribution to other
  # machines, replace with a purchased OV/EV certificate.
  signtoolOptions:
    certificateFile: .certs/aperture-codesign.pfx
    certificatePassword: aperture-local-signing
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aperture

fileAssociations:
  - ext:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - tiff
      - tif
      - bmp
      - avif
      - heic
      - heif
    name: Image File
    description: Open with Aperture
    role: Viewer
    icon: resources/icon.ico
  - ext:
      - mp4
      - webm
      - mov
      - avi
      - mkv
    name: Video File
    description: Open with Aperture
    role: Viewer
    icon: resources/icon.ico
